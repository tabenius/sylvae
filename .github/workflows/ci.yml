name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python virtualenv
        run: python3 -m venv .venv && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Check import
        run: python -c "import sylvae"