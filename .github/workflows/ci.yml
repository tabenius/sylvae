name: CI

on:
  # This said `master`, and the repository's default branch is `main` — so CI has not
  # run on the default branch at all. Every green run in the history is a pull request
  # or a manual dispatch, which is exactly the shape of a repository that believes its
  # main branch is tested when nothing is testing it. A concurrency group and a timeout
  # on a workflow that never fires is polish on a decoration.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python virtualenv
        run: python3 -m venv .venv && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Check import
        run: python -c "import sylvae"