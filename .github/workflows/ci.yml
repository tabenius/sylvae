name: CI

on:
  # This said `master`, and the repository's default branch is `main` — so CI has not
  # run on the default branch at all. Every green run in the history is a pull request
  # or a manual dispatch, which is exactly the shape of a repository that believes its
  # main branch is tested when nothing is testing it. A concurrency group and a timeout
  # on a workflow that never fires is polish on a decoration.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    runs-on: self-hosted
    env:
      # Sylvae's runner loads Nostoi's Python reference writer, which lives in a
      # sibling repository rather than inside this workspace — src/sylvae/runner.py
      # looks for it via SYLVAE_NOSTOI_PYTHON, then RAGBAZ_SRC_ROOT/nostoi/..., and
      # raises "Nostoi's Python reference is unavailable" when neither resolves.
      #
      # This is a self-hosted runner, so the whole RAGBAZ tree is checked out here and
      # one variable is enough. Overridable with a repository variable of the same name
      # for a runner laid out differently; SYLVAE_NOSTOI_PYTHON still wins if set.
      RAGBAZ_SRC_ROOT: ${{ vars.RAGBAZ_SRC_ROOT || '/srv/ragbaz/src/vendors/ragbaz/head' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python virtualenv
        run: python3 -m venv .venv && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --target "$RUNNER_TEMP/sylvae-uv" "uv==0.12.19"
          echo "$RUNNER_TEMP/sylvae-uv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sylvae-uv/bin/uv" sync --locked --extra dev --python "$(command -v python)"

      - name: Run tests
        run: pytest

      - name: Check import
        run: python -c "import sylvae"
