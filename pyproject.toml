[project]
name = "sylvae"
version = "0.1.0"
description = "A portable skill runner across agent backends."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "litellm>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sylvae = "sylvae.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sylvae"]
