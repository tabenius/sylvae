[project]
name = "sylvae"
version = "0.1.0"
description = "A portable skill runner across agent backends."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "litellm>=1.50",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional: only needed for `sylvae mcp`. Core Sylvae and its whole test
# suite work without it, so CI stays green on a clean checkout.
mcp = ["mcp>=1.0"]

[project.scripts]
sylvae = "sylvae.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sylvae"]
